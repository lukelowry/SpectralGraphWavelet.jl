name: CI
on:
  push:
    branches:
      - main
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
          - version: '1.12'
            os: ubuntu-latest
            arch: x64
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
          - version: '1.12'
            os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  qa:
    name: QA (Aqua)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run Aqua checks
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.develop(path=pwd())
          Pkg.add("Aqua")
          using Aqua, SpectralGraphWavelet
          Aqua.test_all(SpectralGraphWavelet; persistent_tasks=false)

  artifact_smoke:
    name: Artifact Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Validate artifact-backed import in clean environment
        shell: julia --color=yes {0}
        run: |
          using Pkg

          src = pwd()
          temp_pkg = mktempdir()
          for entry in readdir(src)
              entry == ".git" && continue
              entry == "data" && continue
              cp(joinpath(src, entry), joinpath(temp_pkg, entry); force=true)
          end

          ENV["JULIA_DEPOT_PATH"] = mktempdir()
          Pkg.activate(temp_pkg)
          Pkg.instantiate()
          Base.eval(Main, :(using SpectralGraphWavelet))
          resource_count = Base.eval(Main, :(length(SpectralGraphWavelet.resource_names())))
          resource_count > 0 || error("No bundled resources discovered.")
